name: keepalive
on:
  schedule:
    - cron: "17 1 * * 1"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping endpoints (skips placeholders)
        run: |
          for url in "https://WORKER_URL_PLACEHOLDER/" "https://kbcmsziepqqqlwbmnauf.supabase.co/"; do
            case "$url" in *PLACEHOLDER*) echo "skip $url"; continue;; esac
            curl -sS -m 20 -o /dev/null "$url" || echo "unreachable: $url"
          done
